<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Reader</title>
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <div class="container mt-5">
        <h1>RSS Reader</h1>

        </form>
    </div>
    <script type="module" src="/src/index.js"></script>
</body>

</html>
